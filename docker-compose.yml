# ============================================
# PlainLedger - Local Development Stack
# ============================================
# Run: docker-compose up -d
# Web: http://localhost:5173
# API: http://localhost:3000
# Admin: http://localhost:3001
# Keycloak: http://localhost:8080 (admin/admin)
# LocalStack: http://localhost:4566 (AWS simulation)
# MinIO: http://localhost:9001 (plainledger/plainledger_secret)
# ============================================
#
# Datalake (Medallion Architecture):
# - Bronze: s3://plainledger-bronze (raw data)
# - Silver: s3://plainledger-silver (cleansed data)
# - Gold: s3://plainledger-gold (analytics-ready)
# ============================================
#
# QuickBooks Integration:
# 1. Set QUICKBOOKS_CLIENT_ID and QUICKBOOKS_CLIENT_SECRET in .env
# 2. Configure redirect URI in QuickBooks Developer Portal
# 3. For local testing, use ngrok: ngrok http 3000
# ============================================

services:
  # ============================================
  # PostgreSQL for Keycloak
  # ============================================
  keycloak-db:
    image: postgres:16-alpine
    container_name: plainledger-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keycloak']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # Keycloak - Identity Provider
  # ============================================
  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: plainledger-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: 'false'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_PROXY: edge
    command: start-dev --import-realm
    ports:
      - '8080:8080'
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
      - ./keycloak/themes/plainledger:/opt/keycloak/themes/plainledger
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'exec 3<>/dev/tcp/localhost/8080 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - plainledger-network

  # ============================================
  # PostgreSQL for Application (with pgvector)
  # ============================================
  app-db:
    image: pgvector/pgvector:pg16
    container_name: plainledger-app-db
    environment:
      POSTGRES_DB: plainledger
      POSTGRES_USER: plainledger
      POSTGRES_PASSWORD: plainledger_secret
    ports:
      - '5432:5432'
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./local-dev/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql
      - ./local-dev/init-datalake.sql:/docker-entrypoint-initdb.d/02-datalake.sql
      - ./local-dev/init-pgvector.sql:/docker-entrypoint-initdb.d/03-pgvector.sql
      - ./local-dev/init-tax-credits.sql:/docker-entrypoint-initdb.d/04-tax-credits.sql
      - ./local-dev/init-jobs.sql:/docker-entrypoint-initdb.d/05-jobs.sql
      - ./local-dev/init-platform.sql:/docker-entrypoint-initdb.d/06-platform.sql
      - ./local-dev/init-tenant-permissions.sql:/docker-entrypoint-initdb.d/07-tenant-permissions.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U plainledger']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # Redis - Caching & Sessions
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: plainledger-redis
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # MongoDB - Analytics & Audit Database
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: plainledger-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: plainledger
      MONGO_INITDB_ROOT_PASSWORD: plainledger_secret
      MONGO_INITDB_DATABASE: plainledger_analytics
    ports:
      - '27017:27017'
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # LocalStack - AWS Services Simulation (S3 only - core module)
  # ============================================
  localstack:
    image: localstack/localstack:3.0
    container_name: plainledger-localstack
    environment:
      # Only load S3 - core service, no extra modules
      SERVICES: s3
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      DATA_DIR: /var/lib/localstack/data
      AWS_DEFAULT_REGION: us-east-1
      EDGE_PORT: 4566
      # Disable unnecessary features for lighter footprint
      SKIP_INFRA_DOWNLOADS: 1
      SKIP_SSL_CERT_DOWNLOAD: 1
    ports:
      - '4566:4566' # LocalStack Edge
    volumes:
      - localstack-data:/var/lib/localstack
      - ./local-dev/localstack-init:/etc/localstack/init/ready.d
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - plainledger-network

  # ============================================
  # MinIO - S3-Compatible Object Storage (Data Lake)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: plainledger-minio
    environment:
      MINIO_ROOT_USER: plainledger
      MINIO_ROOT_PASSWORD: plainledger_secret
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # PlainLedger API
  # ============================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: plainledger-api
    environment:
      NODE_ENV: development
      # LOCAL DEV ONLY: Skip Keycloak auth for easier local testing
      # This is IGNORED in production (app.module.ts checks NODE_ENV !== "production")
      SKIP_AUTH: 'true'
      PORT: 3000
      # Database
      DATABASE_HOST: app-db
      DATABASE_PORT: 5432
      DATABASE_NAME: plainledger
      DATABASE_USER: plainledger
      DATABASE_PASSWORD: plainledger_secret
      # Keycloak
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: plainledger
      KEYCLOAK_CLIENT_ID: plainledger-api
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-change-me-in-production}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # S3 Storage (LocalStack or MinIO)
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localstack:4566}
      S3_REGION: ${S3_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:-plainledger-bronze}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:-plainledger-silver}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:-plainledger-gold}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:-plainledger-uploads}
      # Legacy MinIO support
      MINIO_ACCESS_KEY: plainledger
      MINIO_SECRET_KEY: plainledger_secret
      S3_BUCKET_NAME: plainledger-datalake
      # QuickBooks Integration
      QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
      QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
      QUICKBOOKS_REDIRECT_URI: ${QUICKBOOKS_REDIRECT_URI:-http://localhost:3000/api/v1/datasources/oauth/quickbooks/callback}
      # App URL (for OAuth callbacks)
      APP_URL: ${APP_URL:-http://localhost:5173}
      # MongoDB (Analytics & Audit)
      MONGODB_URI: mongodb://plainledger:plainledger_secret@mongodb:27017/plainledger_analytics?authSource=admin
      MONGODB_DATABASE: plainledger_analytics
      # HubSpot CRM (optional for local dev)
      HUBSPOT_ACCESS_TOKEN: ${HUBSPOT_ACCESS_TOKEN:-}
      # PostHog Analytics (optional for local dev)
      POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
      POSTHOG_HOST: ${POSTHOG_HOST:-https://us.i.posthog.com}
      # Google Analytics
      GA_MEASUREMENT_ID: ${GA_MEASUREMENT_ID:-G-85LVG81DY5}
    ports:
      - '3000:3000'
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      localstack:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - plainledger-network

  # ============================================
  # PlainLedger Admin Console
  # ============================================
  admin:
    build:
      context: .
      dockerfile: apps/admin/Dockerfile
    container_name: plainledger-admin
    environment:
      NODE_ENV: development
      PORT: 3001
      NEXT_PUBLIC_API_URL: http://localhost:3000
      NEXT_PUBLIC_KEYCLOAK_URL: http://localhost:8080
      NEXT_PUBLIC_KEYCLOAK_REALM: plainledger
      NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: plainledger-admin
    ports:
      - '3001:3001'
    depends_on:
      api:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:3001 || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - plainledger-network

  # ============================================
  # Mailhog - Local Email Testing
  # ============================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: plainledger-mailhog
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:8025']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # PlainLedger Web
  # ============================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: plainledger-web
    environment:
      VITE_API_URL: ${API_URL:-http://localhost:3000}
      VITE_GRAPHQL_URL: ${GRAPHQL_URL:-http://localhost:3000/graphql}
      VITE_KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      VITE_KEYCLOAK_REALM: plainledger
      VITE_KEYCLOAK_CLIENT_ID: plainledger-web
    ports:
      - '5173:80'
    depends_on:
      api:
        condition: service_healthy
    networks:
      - plainledger-network

  # ============================================
  # ETL Pipeline Runner (for E2E testing)
  # ============================================
  etl-runner:
    build:
      context: .
      dockerfile: pipelines/Dockerfile
    container_name: plainledger-etl-runner
    environment:
      # AWS/S3 Configuration
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET_BRONZE: plainledger-bronze
      S3_BUCKET_SILVER: plainledger-silver
      S3_BUCKET_GOLD: plainledger-gold
      S3_BUCKET_QUARANTINE: plainledger-quarantine
      # Database for ETL
      DATABASE_HOST: app-db
      DATABASE_PORT: 5432
      DATABASE_NAME: plainledger
      DATABASE_USER: plainledger
      DATABASE_PASSWORD: plainledger_secret
      # Redis (for cache invalidation)
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # OpenAI (for pgvector embeddings - optional in dev)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Pipeline config
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
    volumes:
      - ./pipelines:/app/pipelines
      - ./scripts:/app/scripts
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    networks:
      - plainledger-network
    # Keep container running for manual testing
    command: ['tail', '-f', '/dev/null']
    profiles:
      - etl

  # ============================================
  # ETL Test Data Seeder
  # ============================================
  etl-seeder:
    build:
      context: .
      dockerfile: pipelines/Dockerfile
    container_name: plainledger-etl-seeder
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET_BRONZE: plainledger-bronze
      S3_BUCKET_GOLD: plainledger-gold
    volumes:
      - ./pipelines:/app/pipelines
      - ./scripts:/app/scripts
    depends_on:
      localstack:
        condition: service_healthy
    networks:
      - plainledger-network
    command: ['python', '-m', 'pipelines.tests.seed_test_data']
    profiles:
      - seed

# ============================================
# Volumes
# ============================================
volumes:
  keycloak-db-data:
    driver: local
  app-db-data:
    driver: local
  redis-data:
    driver: local
  mongodb-data:
    driver: local
  minio-data:
    driver: local
  localstack-data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  plainledger-network:
    driver: bridge
