# ============================================
# PlainLedger - Local Development Stack
# ============================================
# Run: docker-compose up -d
# Web: http://localhost:5173
# API: http://localhost:3000
# Keycloak: http://localhost:8080 (admin/admin)
# MinIO: http://localhost:9001 (plainledger/plainledger_secret)
# ============================================

services:
  # ============================================
  # PostgreSQL for Keycloak
  # ============================================
  keycloak-db:
    image: postgres:16-alpine
    container_name: plainledger-keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # Keycloak - Identity Provider
  # ============================================
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: plainledger-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_PROXY: edge
    command: start-dev --import-realm
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realms:/opt/keycloak/data/import
      - ./keycloak/themes/plainledger:/opt/keycloak/themes/plainledger
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - plainledger-network

  # ============================================
  # PostgreSQL for Application
  # ============================================
  app-db:
    image: postgres:16-alpine
    container_name: plainledger-app-db
    environment:
      POSTGRES_DB: plainledger
      POSTGRES_USER: plainledger
      POSTGRES_PASSWORD: plainledger_secret
    ports:
      - "5432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./local-dev/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plainledger"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # Redis - Caching & Sessions
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: plainledger-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - plainledger-network

  # ============================================
  # MinIO - S3-Compatible Object Storage (Data Lake)
  # ============================================
  minio:
    image: minio/minio:latest
    container_name: plainledger-minio
    environment:
      MINIO_ROOT_USER: plainledger
      MINIO_ROOT_PASSWORD: plainledger_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plainledger-network

# ============================================
# Volumes
# ============================================
volumes:
  keycloak-db-data:
    driver: local
  app-db-data:
    driver: local
  redis-data:
    driver: local
  minio-data:
    driver: local

# ============================================
# Networks
# ============================================
networks:
  plainledger-network:
    driver: bridge
