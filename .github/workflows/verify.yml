name: PlainLedger verification

on:
  push:
    branches: [main, 'fix/plainledger-*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.app }} build, types and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [api, web, admin]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npx --no-install tsc --noEmit
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build
      - name: API unit tests
        if: ${{ !cancelled() && matrix.app == 'api' }}
        run: npm test -- --runInBand
      - name: Web unit tests
        if: ${{ !cancelled() && matrix.app == 'web' }}
        run: npm run test:run

  oracle-config:
    name: Oracle configuration validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment helpers
        run: python3 -m unittest discover -s deploy/oracle/tests -v

  real-stack:
    name: Real Keycloak, PostgreSQL, Redis and browser flows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
        env:
          POSTGRES_USER: plainledger
          POSTGRES_PASSWORD: isolated-e2e-only
          POSTGRES_DB: plainledger
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U plainledger -d plainledger"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      NODE_ENV: production
      DATABASE_HOST: localhost
      DATABASE_PORT: '5432'
      DATABASE_USER: plainledger
      DATABASE_PASSWORD: isolated-e2e-only
      DATABASE_NAME: plainledger
      DATABASE_SSL: 'false'
      SYNC_DB: 'false'
      SKIP_AUTH: 'false'
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      REDIS_TLS: 'false'
      KEYCLOAK_URL: http://localhost:8080
      KEYCLOAK_REALM: plainledger
      KEYCLOAK_CLIENT_ID: plainledger-api
      KEYCLOAK_CLIENT_SECRET: plainledger-e2e-disposable-api-secret
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: plainledger
      VITE_MOCK_AUTH: 'false'
      # Generated links use a reserved HTTPS hostname; no test mail leaves this stack.
      WEB_URL: https://plainledger.e2e.invalid
      TEAM_INVITATIONS_EMAIL_ENABLED: 'false'
      # Keycloak's health management listener occupies host port 9000.
      S3_ENDPOINT: http://127.0.0.1:19000
      S3_BUCKET_GOLD: plainledger-e2e
      S3_REGION: us-east-1
      AWS_ACCESS_KEY_ID: plainledger-e2e-storage
      AWS_SECRET_ACCESS_KEY: PlainLedger-E2E-Storage-Only-2026
      ADMIN_URL: http://localhost:5174
      CORS_ORIGINS: http://localhost:5173
      E2E_USERNAME: e2e-owner@plainledger.test
      E2E_PASSWORD: PlainLedger-E2E-Only-2026!
      BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/api/package-lock.json
            apps/web/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm --prefix apps/api ci --include=dev --no-audit --no-fund
          npm --prefix apps/web ci --include=dev --no-audit --no-fund
          npx --no-install playwright install --with-deps chromium
      - name: Compile API and initialize only this empty test database
        run: |
          npm --prefix apps/api run build
          node apps/api/scripts/bootstrap-empty-database.cjs --apply
          if node apps/api/scripts/bootstrap-empty-database.cjs --apply > /tmp/bootstrap-repeat.log 2>&1; then
            echo 'ERROR: bootstrap accepted an existing database'
            exit 1
          fi
          grep -F 'database already contains user tables' /tmp/bootstrap-repeat.log
          node e2e/seed-real-stack.cjs
      - name: Start real Keycloak with isolated test realm
        run: |
          node e2e/prepare-real-stack.cjs
          docker run -d --name plainledger-keycloak-e2e --network host \
            -e KC_DB=postgres \
            -e KC_DB_URL=jdbc:postgresql://localhost:5432/keycloak \
            -e KC_DB_USERNAME=plainledger \
            -e KC_DB_PASSWORD=isolated-e2e-only \
            -e KC_HOSTNAME=http://localhost:8080 \
            -e KC_HTTP_ENABLED=true \
            -e KC_HEALTH_ENABLED=true \
            -v "$PWD/e2e/.runtime/realms:/opt/keycloak/data/import:ro" \
            quay.io/keycloak/keycloak:26.8.1 start --import-realm
          node e2e/wait-for-http.cjs http://localhost:8080/realms/plainledger/.well-known/openid-configuration
      - name: Start production API and web build
        run: |
          node apps/api/dist/main.js > /tmp/plainledger-api.log 2>&1 &
          node e2e/wait-for-http.cjs http://localhost:3000/health/ready
          npm --prefix apps/web run build
          npm --prefix apps/web run preview -- --host 127.0.0.1 --port 5173 > /tmp/plainledger-web.log 2>&1 &
          node e2e/wait-for-http.cjs http://localhost:5173
      - name: Public states and real PKCE authentication
        run: npx --no-install playwright test --config playwright.strict.config.ts
      - name: Install pinned compiler for upstream S3 source build
        if: ${{ !cancelled() }}
        uses: actions/setup-go@v5
        with:
          # Matches the toolchain directive in the pinned upstream go.mod.
          go-version: '1.24.8'
          check-latest: false
          cache: false
      - name: Verify actual object storage and committed accounting snapshots
        if: ${{ !cancelled() }}
        timeout-minutes: 15
        env:
          GOTOOLCHAIN: local
          GOSUMDB: sum.golang.org
          GOPROXY: https://proxy.golang.org,direct
          # Official source release RELEASE.2025-10-15T17-29-55Z, including its security fix.
          # MinIO no longer publishes community container releases. Build the exact source
          # for this disposable test only. This does not qualify an Oracle production image.
          MINIO_SOURCE_COMMIT: 9e49d5e7a648f00e26f2246f4dc28e6b07f8c84a
        run: |
          node --test e2e/wait-for-http.test.cjs
          s3_runtime=$(mktemp -d "$RUNNER_TEMP/plainledger-s3.XXXXXX")
          mkdir -p "$s3_runtime/bin" "$s3_runtime/data" test-results/runtime
          GOBIN="$s3_runtime/bin" CGO_ENABLED=0 go install -trimpath "github.com/minio/minio@$MINIO_SOURCE_COMMIT"
          {
            echo 'repository=https://github.com/minio/minio'
            echo "source_commit=$MINIO_SOURCE_COMMIT"
            echo 'release=RELEASE.2025-10-15T17-29-55Z'
            go version
            go version -m "$s3_runtime/bin/minio"
            sha256sum "$s3_runtime/bin/minio"
          } > test-results/runtime/s3-build.txt
          MINIO_ROOT_USER="$AWS_ACCESS_KEY_ID" MINIO_ROOT_PASSWORD="$AWS_SECRET_ACCESS_KEY" MINIO_BROWSER=off \
            "$s3_runtime/bin/minio" server "$s3_runtime/data" --address 127.0.0.1:19000 \
            > /tmp/plainledger-s3.log 2>&1 &
          s3_pid=$!
          trap 'kill "$s3_pid" 2>/dev/null || true; wait "$s3_pid" 2>/dev/null || true' EXIT
          if ! node e2e/wait-for-http.cjs "$S3_ENDPOINT/minio/health/ready"; then
            cat /tmp/plainledger-s3.log
            exit 1
          fi
          node e2e/datalake-real-storage.cjs
      - name: Collect runtime logs
        if: always()
        run: |
          mkdir -p test-results/runtime
          for log in /tmp/plainledger-api.log /tmp/plainledger-web.log /tmp/plainledger-s3.log /tmp/bootstrap-repeat.log; do
            if test -f "$log"; then cp "$log" test-results/runtime/; fi
          done
          if docker inspect plainledger-keycloak-e2e > /dev/null 2>&1; then
            docker logs plainledger-keycloak-e2e > test-results/runtime/keycloak.log 2>&1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-stack-browser-results
          path: |
            playwright-report
            test-results
          retention-days: 7
