name: Deploy Storybook

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/src/components/**'
      - 'apps/web/.storybook/**'
      - 'apps/web/src/lib/**'
      - '.github/workflows/storybook.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'prod'
        type: choice
        options:
          - prod
          - dev

env:
  AWS_REGION: ca-central-1

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies (with optional deps for native modules)
        run: |
          npm ci --include=optional
          # Explicitly install Rollup Linux bindings (npm bug workaround)
          npm install @rollup/rollup-linux-x64-gnu --save-optional || true
        working-directory: apps/web

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://api.plainledger.ca' }}
          VITE_KEYCLOAK_URL: ${{ secrets.VITE_KEYCLOAK_URL || 'https://auth.plainledger.ca' }}
          VITE_KEYCLOAK_REALM: ${{ secrets.VITE_KEYCLOAK_REALM || 'plainledger' }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ secrets.VITE_KEYCLOAK_CLIENT_ID || 'plainledger-web' }}

      - name: Verify Storybook build
        run: |
          if [ ! -d "apps/web/storybook-static" ]; then
            echo "Error: Storybook build directory not found"
            exit 1
          fi
          if [ ! -f "apps/web/storybook-static/index.html" ]; then
            echo "Error: Storybook index.html not found"
            exit 1
          fi
          echo "✓ Storybook build verified"

      - name: Configure AWS credentials (GitHub OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN || vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: GitHubActions-StorybookDeploy

      - name: Get deployment variables
        id: vars
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'prod' }}
          STORYBOOK_BUCKET_PROD: ${{ vars.STORYBOOK_BUCKET_PROD || 'plainledger-prod-storybook' }}
          STORYBOOK_CF_ID_PROD: ${{ vars.STORYBOOK_CF_ID_PROD || '' }}
          STORYBOOK_BUCKET_DEV: ${{ vars.STORYBOOK_BUCKET_DEV || 'plainledger-dev-storybook' }}
          STORYBOOK_CF_ID_DEV: ${{ vars.STORYBOOK_CF_ID_DEV || '' }}
        run: |
          ENV="${ENVIRONMENT}"
          echo "environment=${ENV}" >> $GITHUB_OUTPUT
          
          if [ "${ENV}" = "prod" ]; then
            BUCKET="${STORYBOOK_BUCKET_PROD}"
            CF_ID="${STORYBOOK_CF_ID_PROD}"
          else
            BUCKET="${STORYBOOK_BUCKET_DEV}"
            CF_ID="${STORYBOOK_CF_ID_DEV}"
          fi
          
          echo "bucket=${BUCKET}" >> $GITHUB_OUTPUT
          echo "cf_id=${CF_ID}" >> $GITHUB_OUTPUT
          
          echo "📦 Deployment Configuration:"
          echo "   Environment: ${ENV}"
          echo "   S3 Bucket: ${BUCKET}"
          echo "   CloudFront ID: ${CF_ID:-'Not set (will skip invalidation)'}"

      - name: Deploy to S3
        run: |
          echo "Deploying to S3 bucket: ${{ steps.vars.outputs.bucket }}"
          aws s3 sync apps/web/storybook-static \
            s3://${{ steps.vars.outputs.bucket }} \
            --delete \
            --cache-control "public, max-age=3600" \
            --exclude "*.html" \
            --exclude "*.json"

          # HTML and JSON files with no-cache for auth
          aws s3 sync apps/web/storybook-static \
            s3://${{ steps.vars.outputs.bucket }} \
            --cache-control "no-cache, no-store, must-revalidate" \
            --include "*.html" \
            --include "*.json"

      - name: Invalidate CloudFront cache
        if: steps.vars.outputs.cf_id != ''
        run: |
          echo "Invalidating CloudFront distribution: ${{ steps.vars.outputs.cf_id }}"
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ steps.vars.outputs.cf_id }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)
          echo "✓ CloudFront invalidation created: $INVALIDATION_ID"

          # Wait for invalidation to complete (optional, can be async)
          echo "Waiting for invalidation to complete..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ steps.vars.outputs.cf_id }} \
            --id $INVALIDATION_ID || echo "Note: Invalidation may still be in progress"

      - name: Deployment summary
        run: |
          echo "## ✅ Storybook Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ steps.vars.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **S3 Bucket**: ${{ steps.vars.outputs.bucket }}" >> $GITHUB_STEP_SUMMARY
          echo "- **CloudFront**: ${{ steps.vars.outputs.cf_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **URL**: https://storybook.plainledger.ca" >> $GITHUB_STEP_SUMMARY
