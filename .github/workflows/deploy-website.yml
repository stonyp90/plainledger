# Deploys the public website (apps/web) to Cloudflare Workers on the free plan.
# One-time setup (Cloudflare zone, GoDaddy nameservers, API token): docs/CLOUDFLARE_DEPLOYMENT.md
name: Deploy Website (Cloudflare)

on:
  workflow_run:
    workflows: ['PlainLedger verification']
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-website
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: '22'
  WRANGLER_VERSION: '4.137.0'
  DOMAIN: plainledger.ca

jobs:
  preflight:
    name: Require verified current main and Cloudflare credentials
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.head_branch == 'main' &&
       (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.creds.outputs.ready }}
      source_sha: ${{ steps.verify.outputs.source_sha }}
      verification_url: ${{ steps.verify.outputs.verification_url }}
    steps:
      - name: Require successful verification of this exact current main commit
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source_run_id=''
          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            jq -e --arg repository "$GITHUB_REPOSITORY" '
              .workflow_run |
              .head_repository.full_name == $repository and
              .head_branch == "main" and
              (.event == "push" or .event == "workflow_dispatch") and
              .status == "completed" and .conclusion == "success"
            ' "$GITHUB_EVENT_PATH" > /dev/null
            source_sha=$(jq -er '.workflow_run.head_sha' "$GITHUB_EVENT_PATH")
            source_run_id=$(jq -er '.workflow_run.id | tostring' "$GITHUB_EVENT_PATH")
          elif [ "$GITHUB_EVENT_NAME" = 'workflow_dispatch' ] && [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            source_sha="$GITHUB_SHA"
          else
            echo '::error::Website deployment requires verified source from this repository main branch.'
            exit 1
          fi
          [[ "$source_sha" =~ ^[a-f0-9]{40}$ ]] || exit 1
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?branch=main&head_sha=${source_sha}&per_page=100" \
            > "$RUNNER_TEMP/website-verification-runs.json"
          # Select the newest main push/manual run before checking its result. An older
          # success must not hide a newer failed, cancelled, queued or rerunning attempt.
          verification_url=$(jq -er --arg repository "$GITHUB_REPOSITORY" --arg sha "$source_sha" --arg run_id "$source_run_id" '
            [.workflow_runs[] | select(
              .head_repository.full_name == $repository and .head_branch == "main" and .head_sha == $sha and
              (.event == "push" or .event == "workflow_dispatch")
            )] | max_by(.id) |
            select(.status == "completed" and .conclusion == "success") |
            select($run_id == "" or (.id | tostring) == $run_id) | .html_url
          ' "$RUNNER_TEMP/website-verification-runs.json") || {
            echo '::error::The exact source commit has no current successful verify.yml run. Deployment remains blocked.'
            exit 1
          }
          current_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$source_sha" != "$current_main_sha" ]; then
            echo '::error::This verification is stale: main has advanced. Deploy the latest verified main commit.'
            exit 1
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "verification_url=$verification_url" >> "$GITHUB_OUTPUT"
          echo "Verified source: $source_sha ($verification_url)"
      - id: creds
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::error::Website deployment is blocked: configure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (docs/CLOUDFLARE_DEPLOYMENT.md)."
            exit 1
          fi

  deploy:
    name: Deploy to Cloudflare Workers
    needs: preflight
    if: needs.preflight.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci --include=optional

      - name: Build website
        working-directory: apps/web
        env:
          VITE_MOCK_AUTH: 'false'
          # Empty until the backend is back: the app then runs in guest mode (public pages
          # only). Set these as repository variables to re-enable sign-in.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_KEYCLOAK_URL: ${{ vars.VITE_KEYCLOAK_URL }}
          VITE_KEYCLOAK_REALM: ${{ vars.VITE_KEYCLOAK_REALM || 'plainledger' }}
          VITE_KEYCLOAK_CLIENT_ID: ${{ vars.VITE_KEYCLOAK_CLIENT_ID || 'plainledger-web' }}
        run: npm run build

      - name: Check Cloudflare zone status
        id: zone
        run: |
          code=$(curl --connect-timeout 5 --max-time 20 -sS -o zone.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/zones?name=${DOMAIN}&account.id=${CLOUDFLARE_ACCOUNT_ID}" || true)
          if [ "$code" != "200" ]; then
            echo "::warning::Could not read the ${DOMAIN} zone (HTTP $code): $(jq -c '.errors' zone.json 2>/dev/null). Does the token have Zone:Read?"
          fi
          status=$(jq -r '.result[0].status // "not found"' zone.json 2>/dev/null || echo "not found")
          nameservers=$(jq -r '(.result[0].name_servers // []) | join(" ")' zone.json 2>/dev/null || true)
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "nameservers=$nameservers" >> "$GITHUB_OUTPUT"
          echo "Zone ${DOMAIN}: ${status} ${nameservers:+(Cloudflare nameservers: $nameservers)}"

      - name: Recheck current main immediately before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          current_main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')
          if [ "$SOURCE_SHA" != "$current_main_sha" ]; then
            echo '::error::Main advanced during the build. This stale deployment remains blocked.'
            exit 1
          fi

      - name: Deploy website Worker
        id: deploy
        working-directory: apps/web
        env:
          ZONE_STATUS: ${{ steps.zone.outputs.status }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          args=()
          # Custom domains need an active zone; until then the site is only on workers.dev
          if [ "$ZONE_STATUS" = "active" ]; then args+=(--domain "$DOMAIN"); fi
          if [ -n "$API_ORIGIN" ]; then args+=(--var "API_ORIGIN:$API_ORIGIN"); fi
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy "${args[@]}" | tee deploy.log
          echo "workers_dev_url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)" >> "$GITHUB_OUTPUT"

      - name: Deploy www redirect Worker
        if: steps.zone.outputs.status == 'active'
        working-directory: apps/web
        run: npx --yes "wrangler@${WRANGLER_VERSION}" deploy --config wrangler.www.jsonc --domain "www.${DOMAIN}"

      - name: Smoke test
        id: smoke
        env:
          WORKERS_DEV_URL: ${{ steps.deploy.outputs.workers_dev_url }}
          ZONE_STATUS: ${{ steps.zone.outputs.status }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          # Retry the complete response contract while the edge picks up the deploy.
          response_body_matches() {
            case "$1" in
              page) grep -Fq PlainLedger body.txt ;;
              unavailable) jq -e '.statusCode == 503 and .error == "SERVICE_UNAVAILABLE"' body.txt > /dev/null 2>&1 ;;
              ready) jq -e '.status == "ready" and .checks.database == "connected" and .checks.cache == "connected"' body.txt > /dev/null 2>&1 ;;
              *) return 1 ;;
            esac
          }
          # usage: check_url <url> <status> <page|unavailable|ready>
          check_url() {
            local code attempt
            for ((attempt=1; attempt<=12; attempt++)); do
              code=$(curl --connect-timeout 5 --max-time 20 -sS -o body.txt -w '%{http_code}' "$1" || true)
              if [ "$code" = "$2" ] && response_body_matches "$3"; then
                echo "OK   $1 -> $code"; return 0
              fi
              if [ "$attempt" -lt 12 ]; then sleep 10; fi
            done
            echo "FAIL $1 -> $code (expected $2 with $3 response)"; return 1
          }
          # Do not follow redirects: the first response must preserve both path and query.
          check_redirect() {
            local code attempt
            for ((attempt=1; attempt<=12; attempt++)); do
              code=$(curl --connect-timeout 5 --max-time 20 -sS \
                --dump-header redirect-headers.txt --output /dev/null --write-out '%{http_code}' "$1" || true)
              if [ "$code" = '301' ] && node -e 'const headers=require("node:fs").readFileSync("redirect-headers.txt","utf8"); const locations=headers.split(/\r?\n/).filter(line=>/^location:/i.test(line)).map(line=>line.replace(/^location:\s*/i,"").trim()); if(locations.length!==1 || locations[0]!==process.argv[1]) process.exit(1);' "$2"; then
                echo "OK   $1 -> 301 $2"; return 0
              fi
              if [ "$attempt" -lt 12 ]; then sleep 10; fi
            done
            echo "FAIL $1 -> $code (expected 301 to $2)"; return 1
          }
          if [[ ! "$WORKERS_DEV_URL" =~ ^https://[a-z0-9.-]+\.workers\.dev$ ]]; then
            echo '::error::The deployment did not report a valid workers.dev URL.'
            exit 1
          fi
          check_url "$WORKERS_DEV_URL/" 200 page
          check_url "$WORKERS_DEV_URL/quebec" 200 page
          if [ -z "$API_ORIGIN" ]; then
            check_url "$WORKERS_DEV_URL/api/health" 503 unavailable
            check_url "$WORKERS_DEV_URL/health/ready" 503 unavailable
          else
            check_url "$WORKERS_DEV_URL/health/ready" 200 ready
          fi
          if [ "$ZONE_STATUS" = "active" ]; then
            check_url "https://${DOMAIN}/" 200 page
            if [ -z "$API_ORIGIN" ]; then
              check_url "https://${DOMAIN}/health/ready" 503 unavailable
            else
              check_url "https://${DOMAIN}/health/ready" 200 ready
            fi
            check_redirect "https://www.${DOMAIN}/login?source=deployment-smoke" \
              "https://${DOMAIN}/login?source=deployment-smoke"
          fi

      - name: Summary
        if: always()
        env:
          WORKERS_DEV_URL: ${{ steps.deploy.outputs.workers_dev_url }}
          ZONE_STATUS: ${{ steps.zone.outputs.status }}
          NAMESERVERS: ${{ steps.zone.outputs.nameservers }}
          SMOKE_OUTCOME: ${{ steps.smoke.outcome }}
          VERIFICATION_URL: ${{ needs.preflight.outputs.verification_url }}
          API_ORIGIN: ${{ vars.API_ORIGIN }}
        run: |
          {
            echo "## Website deploy (Cloudflare Workers)"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Verified source | \`${SOURCE_SHA}\` |"
            echo "| Verification run | ${VERIFICATION_URL} |"
            echo "| workers.dev | ${WORKERS_DEV_URL:-n/a} |"
            echo "| Zone \`${DOMAIN}\` | ${ZONE_STATUS:-unknown} |"
            if [ "$ZONE_STATUS" = "active" ] && [ "$SMOKE_OUTCOME" = "success" ]; then
              echo "| Website verified at | https://${DOMAIN} (www redirect checked) |"
              if [ -z "$API_ORIGIN" ]; then
                echo "| Account application | Unavailable: no backend origin configured |"
              else
                echo "| Backend readiness | Database and cache connectivity verified |"
              fi
            else
              echo "| Deployment verification | Incomplete: inspect the failed or skipped steps |"
            fi
            echo ""
            if [ "$ZONE_STATUS" = "pending" ]; then
              echo "**Next step:** at GoDaddy, set the nameservers of \`${DOMAIN}\` to: \`${NAMESERVERS}\`, then re-run this workflow once Cloudflare shows the zone as Active."
            elif [ "$ZONE_STATUS" != "active" ]; then
              echo "**Next step:** add \`${DOMAIN}\` to Cloudflare (Free plan), then point the GoDaddy nameservers to it. See docs/CLOUDFLARE_DEPLOYMENT.md."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
