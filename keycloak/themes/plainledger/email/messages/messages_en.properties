# PlainLedger Email - English

# General
realmName=PlainLedger

# Email Subjects
emailVerificationSubject=Verify your PlainLedger email
passwordResetSubject=Reset your PlainLedger password
emailUpdateConfirmationSubject=Confirm your new email
executeActionsSubject=Update Your Account
eventLoginErrorSubject=Security Alert: Failed Login Attempt

# Email Body
emailVerificationBodyHtml=<p>Hi {0},</p><p>Someone has created a PlainLedger account with this email address. If this was you, click the link below to verify your email:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Verify Email Address</a></p><p>This link will expire in 24 hours.</p><p>If you didn't create this account, you can safely ignore this email.</p><p>— The PlainLedger Team</p>

passwordResetBodyHtml=<p>Hi {0},</p><p>We received a request to reset your PlainLedger password. Click the link below to set a new password:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Reset Password</a></p><p>This link will expire in 15 minutes.</p><p>If you didn't request a password reset, you can safely ignore this email. Your password will remain unchanged.</p><p>— The PlainLedger Team</p>

executeActionsBodyHtml=<p>Hi {0},</p><p>Your administrator has requested that you update your account. Click the link below to complete this process:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Update Account</a></p><p>This link will expire in {2} minutes.</p><p>If you didn't expect this email, please contact support.</p><p>— The PlainLedger Team</p>

emailUpdateConfirmationBodyHtml=<p>Hi {0},</p><p>We received a request to change the email address associated with your PlainLedger account. Click the link below to confirm this change:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Confirm New Email</a></p><p>This link will expire in 24 hours.</p><p>If you didn't request this change, please secure your account immediately.</p><p>— The PlainLedger Team</p>

eventLoginErrorBodyHtml=<p>Hi {0},</p><p>We detected a failed login attempt to your PlainLedger account:</p><ul><li><strong>Time:</strong> {1}</li><li><strong>IP Address:</strong> {2}</li></ul><p>If this wasn't you, your password may have been compromised. Please reset your password immediately.</p><p>If this was you, you can safely ignore this email.</p><p>— The PlainLedger Team</p>

