# Corps des courriels (HTML)
emailVerificationBodyHtml=<p>Bonjour {0},</p><p>Un compte PlainLedger a été créé avec cette adresse courriel. Si c'était bien vous, cliquez sur le lien ci-dessous pour vérifier votre courriel:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Vérifier l'adresse courriel</a></p><p>Ce lien expirera dans 24 heures.</p><p>Si vous n'avez pas créé ce compte, vous pouvez ignorer ce courriel.</p><p>— L'équipe PlainLedger</p>

passwordResetBodyHtml=<p>Bonjour {0},</p><p>Nous avons reçu une demande de réinitialisation de votre mot de passe PlainLedger. Cliquez sur le lien ci-dessous pour définir un nouveau mot de passe:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Réinitialiser le mot de passe</a></p><p>Ce lien expirera dans 15 minutes.</p><p>Si vous n'avez pas demandé de réinitialisation de mot de passe, vous pouvez ignorer ce courriel. Votre mot de passe restera inchangé.</p><p>— L'équipe PlainLedger</p>

executeActionsBodyHtml=<p>Bonjour {0},</p><p>Votre administrateur a demandé que vous mettiez à jour votre compte. Cliquez sur le lien ci-dessous pour terminer ce processus:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Mettre à jour le compte</a></p><p>Ce lien expirera dans {2} minutes.</p><p>Si vous n'attendiez pas ce courriel, veuillez contacter le support.</p><p>— L'équipe PlainLedger</p>

emailUpdateConfirmationBodyHtml=<p>Bonjour {0},</p><p>Nous avons reçu une demande de modification de l'adresse courriel associée à votre compte PlainLedger. Cliquez sur le lien ci-dessous pour confirmer ce changement:</p><p><a href="{1}" style="display: inline-block; padding: 12px 24px; background-color: #059669; color: #ffffff; text-decoration: none; border-radius: 8px; font-weight: 500;">Confirmer le nouveau courriel</a></p><p>Ce lien expirera dans 24 heures.</p><p>Si vous n'avez pas demandé ce changement, veuillez sécuriser votre compte immédiatement.</p><p>— L'équipe PlainLedger</p>

eventLoginErrorBodyHtml=<p>Bonjour {0},</p><p>Nous avons détecté une tentative de connexion échouée à votre compte PlainLedger:</p><ul><li><strong>Heure:</strong> {1}</li><li><strong>Adresse IP:</strong> {2}</li></ul><p>Si ce n'était pas vous, votre mot de passe pourrait être compromis. Veuillez réinitialiser votre mot de passe immédiatement.</p><p>Si c'était vous, vous pouvez ignorer ce courriel.</p><p>— L'équipe PlainLedger</p>

