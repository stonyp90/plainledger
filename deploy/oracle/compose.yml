# Deployment candidate for an already provisioned OCI VM.
# Run scripts/deploy.py; it validates and loads the host-only runtime.env file.
name: plainledger-oracle

x-service: &service
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: '3'

x-api-environment: &api-environment
  NODE_ENV: production
  PORT: '3000'
  SKIP_AUTH: 'false'
  SYNC_DB: 'false'
  DATABASE_HOST: app-db
  DATABASE_PORT: '5432'
  DATABASE_NAME: ${APP_DB_NAME:?Run env validation first}
  DATABASE_USER: ${APP_DB_USER:?Run env validation first}
  DATABASE_PASSWORD: ${APP_DB_PASSWORD:?Run env validation first}
  DATABASE_URL: ${DATABASE_URL:?Generated by env validation}
  # Plaintext is restricted to the private bridge on this single VM.
  DATABASE_SSL: 'false'
  KEYCLOAK_URL: https://${AUTH_DOMAIN:?Required}
  KEYCLOAK_REALM: plainledger
  KEYCLOAK_CLIENT_ID: plainledger-api
  KEYCLOAK_ADMIN_CLIENT_ID: plainledger-api
  KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Required}
  REDIS_HOST: redis
  REDIS_PORT: '6379'
  REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
  REDIS_TLS: 'false'
  MONGODB_URI: ${MONGODB_URI:?Generated by env validation}
  MONGODB_DATABASE: ${MONGO_APP_DB:?Required}
  S3_ENDPOINT: http://minio:9000
  S3_PUBLIC_ENDPOINT: https://${STORAGE_DOMAIN:?Required}
  S3_REGION: ${S3_REGION:?Required}
  AWS_ACCESS_KEY_ID: ${MINIO_APP_ACCESS_KEY:?Required}
  AWS_SECRET_ACCESS_KEY: ${MINIO_APP_SECRET_KEY:?Required}
  AWS_EC2_METADATA_DISABLED: 'true'
  S3_BUCKET_NAME: ${S3_BUCKET_BRONZE:?Required}
  S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:?Required}
  S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:?Required}
  S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:?Required}
  S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:?Required}
  S3_BUCKET_DOCUMENT_SHARE: ${S3_BUCKET_DOCUMENT_SHARE:?Required}
  APP_URL: https://${APP_DOMAIN:?Required}
  APP_BASE_URL: https://${APP_DOMAIN:?Required}
  CORS_ORIGIN: https://${APP_DOMAIN},https://${ADMIN_DOMAIN}
  UNSUBSCRIBE_SECRET: ${UNSUBSCRIBE_SECRET:?Required}
  # External providers are optional configuration, not verified by deployment.
  QUICKBOOKS_CLIENT_ID: ${QUICKBOOKS_CLIENT_ID:-}
  QUICKBOOKS_CLIENT_SECRET: ${QUICKBOOKS_CLIENT_SECRET:-}
  QUICKBOOKS_REDIRECT_URI: https://${APP_DOMAIN}/api/integrations/quickbooks/callback
  STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
  STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  caddy:
    <<: *service
    image: ${CADDY_IMAGE:?Set a reviewed image reference}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Required}
      AUTH_DOMAIN: ${AUTH_DOMAIN:?Required}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:?Required}
      STORAGE_DOMAIN: ${STORAGE_DOMAIN:?Required}
      TLS_EMAIL: ${TLS_EMAIL:?Required}
      RELEASE_SHA: ${RELEASE_SHA:?Required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge:
        aliases:
          - ${AUTH_DOMAIN}
          - ${STORAGE_DOMAIN}
      storage: {}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/ready']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  app-db:
    <<: *service
    image: ${APP_DB_IMAGE:?Set a reviewed pgvector PostgreSQL image}
    environment:
      POSTGRES_DB: ${APP_DB_NAME:?Required}
      POSTGRES_USER: ${APP_DB_USER:?Required}
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?Required}
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./init/app-db.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 2g

  keycloak-db:
    <<: *service
    image: ${KEYCLOAK_DB_IMAGE:?Set a reviewed PostgreSQL image}
    environment:
      POSTGRES_DB: ${KEYCLOAK_DB_NAME:?Required}
      POSTGRES_USER: ${KEYCLOAK_DB_USER:?Required}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    networks: [identity]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    mem_limit: 1g

  keycloak:
    <<: *service
    image: plainledger/keycloak:${RELEASE_SHA:?Required immutable commit SHA}
    build:
      context: ../../keycloak
      dockerfile: Dockerfile
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KEYCLOAK_DB_NAME}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:?Required}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Required}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?Required}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Required}
      KC_HOSTNAME: https://${AUTH_DOMAIN:?Required}
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_MANAGEMENT_PORT: '9000'
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?Required}
      WEB_URL: https://${APP_DOMAIN:?Required}
      API_URL: https://${APP_DOMAIN:?Required}
      ADMIN_URL: https://${ADMIN_DOMAIN:?Required}
      SMTP_HOST: ${SMTP_HOST:?Required for account emails}
      SMTP_PORT: ${SMTP_PORT:?Required}
      SMTP_USER: ${SMTP_USER:?Required}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Required}
      SMTP_FROM: ${SMTP_FROM:?Required}
      SMTP_STARTTLS: 'true'
      SMTP_SSL: 'false'
    depends_on:
      keycloak-db:
        condition: service_healthy
    networks: [edge, identity]
    healthcheck:
      test: ['CMD-SHELL', 'bash -ec ''exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.0\r\n\r\n" >&3; head -1 <&3 | grep -q " 200 "''']
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 60s
    mem_limit: 2g

  redis:
    <<: *service
    image: ${REDIS_IMAGE:?Set a reviewed Redis image}
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Required}
    command: ['sh', '-ec', 'exec redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD}"']
    volumes:
      - redis-data:/data
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -qx PONG']
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  mongodb:
    <<: *service
    image: ${MONGODB_IMAGE:?Set a reviewed MongoDB image}
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?Required}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Required}
      MONGO_INITDB_DATABASE: ${MONGO_APP_DB:?Required}
      MONGO_APP_DB: ${MONGO_APP_DB:?Required}
      MONGO_APP_USER: ${MONGO_APP_USER:?Required}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Required}
    volumes:
      - mongodb-data:/data/db
      - ./init/mongodb.js:/docker-entrypoint-initdb.d/01-app-user.js:ro
    networks: [database]
    healthcheck:
      test: ['CMD-SHELL', 'mongosh --quiet --eval ''const d=db.getSiblingDB("admin"); d.auth(process.env.MONGO_INITDB_ROOT_USERNAME,process.env.MONGO_INITDB_ROOT_PASSWORD); if(d.runCommand({ping:1}).ok!==1)quit(1);'' >/dev/null']
      interval: 10s
      timeout: 8s
      retries: 12
      start_period: 30s
    mem_limit: 1g

  minio:
    <<: *service
    image: ${MINIO_IMAGE:?Set a reviewed MinIO image}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required}
      MINIO_REGION_NAME: ${S3_REGION:?Required}
      MINIO_BROWSER: 'off'
    command: ['server', '/data', '--console-address', ':9001']
    volumes:
      - minio-data:/data
    networks: [storage]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://127.0.0.1:9000/minio/health/ready']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    mem_limit: 1g

  storage-init:
    image: ${MINIO_CLIENT_IMAGE:?Set a reviewed MinIO client image}
    restart: 'no'
    security_opt: ['no-new-privileges:true']
    entrypoint: ['/bin/sh', '/init/storage.sh']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Required}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:?Required}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:?Required}
      S3_BUCKET_BRONZE: ${S3_BUCKET_BRONZE:?Required}
      S3_BUCKET_SILVER: ${S3_BUCKET_SILVER:?Required}
      S3_BUCKET_GOLD: ${S3_BUCKET_GOLD:?Required}
      S3_BUCKET_UPLOADS: ${S3_BUCKET_UPLOADS:?Required}
      S3_BUCKET_DOCUMENT_SHARE: ${S3_BUCKET_DOCUMENT_SHARE:?Required}
    volumes:
      - ./init/storage.sh:/init/storage.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    networks: [storage]
    mem_limit: 256m

  schema-check:
    image: ${APP_DB_IMAGE:?Required}
    restart: 'no'
    environment:
      PGHOST: app-db
      PGDATABASE: ${APP_DB_NAME:?Required}
      PGUSER: ${APP_DB_USER:?Required}
      PGPASSWORD: ${APP_DB_PASSWORD:?Required}
    entrypoint: ['/bin/sh', '-ec']
    command: ['exec psql -v ON_ERROR_STOP=1 -f /checks/schema.sql']
    volumes:
      - ./init/schema-check.sql:/checks/schema.sql:ro
    depends_on:
      app-db:
        condition: service_healthy
    networks: [database]

  api:
    <<: *service
    image: plainledger/api:${RELEASE_SHA:?Required}
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
      args:
        CACHE_BUST: ${RELEASE_SHA}
    environment: *api-environment
    depends_on:
      schema-check:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    networks: [edge, database, storage]
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:3000/health/ready").then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 45s
    mem_limit: 2g

  web:
    <<: *service
    image: plainledger/web:${RELEASE_SHA:?Required}
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: https://${APP_DOMAIN:?Required}
        VITE_KEYCLOAK_URL: https://${AUTH_DOMAIN:?Required}
        VITE_KEYCLOAK_REALM: plainledger
        VITE_KEYCLOAK_CLIENT_ID: plainledger-web
        VITE_MOCK_AUTH: 'false'
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m

  admin:
    <<: *service
    image: plainledger/admin:${RELEASE_SHA:?Required}
    build:
      context: ../../apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN:?Required}
        NEXT_PUBLIC_KEYCLOAK_URL: https://${AUTH_DOMAIN:?Required}
        NEXT_PUBLIC_KEYCLOAK_REALM: plainledger
        NEXT_PUBLIC_KEYCLOAK_CLIENT_ID: plainledger-admin
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: 0.0.0.0
    networks: [edge]
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:3001/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 1g

networks:
  edge: {}
  database:
    internal: true
  identity:
    internal: true
  storage:
    internal: true

volumes:
  app-db-data: {}
  keycloak-db-data: {}
  redis-data: {}
  mongodb-data: {}
  minio-data: {}
  caddy-data: {}
  caddy-config: {}
