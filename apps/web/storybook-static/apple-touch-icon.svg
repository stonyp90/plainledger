<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <!-- Apple Touch Icon - PlainLedger Brand Colors -->
  <defs>
    <linearGradient id="touchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#touchGradient)"/>
  
  <!-- Ledger book spine -->
  <rect x="28" y="34" width="17" height="112" rx="6" fill="rgba(255,255,255,0.5)"/>
  
  <!-- Ledger pages -->
  <rect x="50" y="34" width="101" height="112" rx="11" fill="white"/>
  
  <!-- Ledger lines -->
  <line x1="67" y1="56" x2="135" y2="56" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <line x1="67" y1="78" x2="135" y2="78" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  <line x1="67" y1="100" x2="112" y2="100" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
  
  <!-- Checkmark -->
  <path d="M101 112 L117 128 L145 96" stroke="#10b981" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
