<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square -->
  <rect x="2" y="2" width="28" height="28" rx="6" fill="#1e40af"/>
  
  <!-- Ledger book spine -->
  <rect x="5" y="6" width="3" height="20" rx="1" fill="#3b82f6"/>
  
  <!-- Ledger pages -->
  <rect x="9" y="6" width="18" height="20" rx="2" fill="white"/>
  
  <!-- Ledger lines -->
  <line x1="12" y1="10" x2="24" y2="10" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="14" x2="24" y2="14" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12" y1="18" x2="20" y2="18" stroke="#cbd5e1" stroke-width="1.5" stroke-linecap="round"/>
  
  <!-- Checkmark indicating accuracy/validation -->
  <path d="M18 20 L21 23 L26 17" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
