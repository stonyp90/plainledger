<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- PlainLedger Logo - Brand Colors -->
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
  </defs>
  
  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#logoGradient)"/>
  
  <!-- Ledger book spine -->
  <rect x="80" y="96" width="48" height="320" rx="16" fill="rgba(255,255,255,0.5)"/>
  
  <!-- Ledger pages -->
  <rect x="144" y="96" width="288" height="320" rx="32" fill="white"/>
  
  <!-- Ledger lines -->
  <line x1="192" y1="160" x2="384" y2="160" stroke="#cbd5e1" stroke-width="24" stroke-linecap="round"/>
  <line x1="192" y1="224" x2="384" y2="224" stroke="#cbd5e1" stroke-width="24" stroke-linecap="round"/>
  <line x1="192" y1="288" x2="320" y2="288" stroke="#cbd5e1" stroke-width="24" stroke-linecap="round"/>
  
  <!-- Checkmark - Brand Green -->
  <path d="M288 320 L336 368 L416 272" stroke="#10b981" stroke-width="40" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
