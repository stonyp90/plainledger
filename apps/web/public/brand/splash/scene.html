<script>(function(){'use strict';

const word=new Image();word.src=AS.word;
const FR=new URLSearchParams(location.search).get('lang')==='fr';
const text=FR?['Des finances d’entreprise plus claires.','Le contexte comptable. De meilleures questions. De meilleures décisions.']:['Clarity for business finances.','Accounting context. Better questions. Better decisions.'];
let bg=null;
function resize(w=innerWidth,h=innerHeight,scale=Math.min(devicePixelRatio||1,2)){W=w;H=h;dpr=scale;c.width=Math.round(W*dpr);c.height=Math.round(H*dpr);c.style.width=W+'px';c.style.height=H+'px';bg=null;render(elapsed)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r)}
function background(t){
 if(!bg){bg=document.createElement('canvas');bg.width=W;bg.height=H;const b=bg.getContext('2d');let g=b.createLinearGradient(0,H,W,0);g.addColorStop(0,'#06111e');g.addColorStop(.5,'#0b1c2a');g.addColorStop(1,'#061220');b.fillStyle=g;b.fillRect(0,0,W,H);let q=b.createRadialGradient(W*.48,H*.47,0,W*.48,H*.47,Math.max(W,H)*.6);q.addColorStop(0,'rgba(16,185,129,.13)');q.addColorStop(.55,'rgba(16,185,129,.025)');q.addColorStop(1,'rgba(16,185,129,0)');b.fillStyle=q;b.fillRect(0,0,W,H);}
 ctx.drawImage(bg,0,0,W,H);
 const unit=Math.max(34,Math.min(W,H)*.063);ctx.strokeStyle='rgba(98,214,186,.036)';ctx.lineWidth=1;
 for(let x=W/2%unit;x<W;x+=unit){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}
 for(let y=H/2%unit;y<H;y+=unit){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.globalAlpha=.18*(1-s(1.8,3.2,t));
 for(let i=0;i<24;i++){const x=(i*137.3%1000)/1000*W,y=((i*181.7%1000)/1000)*H;ctx.fillStyle='#66dfb9';ctx.fillRect(x+Math.sin(i)*t*9,y,1.5,1.5)}ctx.globalAlpha=1;
}
function fitText(str,maxw,size){ctx.font='500 '+size+'px Arial,sans-serif';while(ctx.measureText(str).width>maxw&&size>10){size-=1;ctx.font='500 '+size+'px Arial,sans-serif'}return size}
function render(t){
 t=Math.max(0,Math.min(5,t));ctx.setTransform(dpr,0,0,dpr,0,0);ctx.globalAlpha=1;background(t);
 const portrait=W/H<.9,short=Math.min(W,H),p=s(1.65,2.8,t),u=s(.15,1.65,t);
 const initial=Math.min(short*.3,H*.30),finalSize=portrait?W*.25:H*.21;
 const endX=portrait?W*.5:W*.5-W*.31,endY=portrait?H*.34:H*.455;
 const size=lerp(initial,finalSize,p),mx=lerp(W*.5,endX,p),my=lerp(H*.46,endY,p);
 // Nine existing brand cells. All motion settles onto their original geometry.
 for(let i=0;i<9;i++){
  const col=i%3,row=Math.floor(i/3),q=s(.18+i*.075,1.32+i*.075,t),spacing=size*.26,cell=size*.2;
  const fx=mx+(col-1)*spacing,fy=my+(row-1)*spacing;
  const angle=i*2.399963,startx=W*.5+Math.cos(angle)*W*(.30+(i%3)*.06),starty=H*.46+Math.sin(angle)*H*.32;
  const x=lerp(startx,fx,q),y=lerp(starty,fy,q),sz=cell*lerp(.3,1,q);
  ctx.save();ctx.translate(x,y);ctx.rotate((1-q)*((i%2?1:-1)*.24));ctx.globalAlpha=s(.05+i*.06,.48+i*.06,t);
  if(q<.98){ctx.strokeStyle='rgba(101,228,190,.09)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(-Math.cos(angle)*45*(1-q),-Math.sin(angle)*45*(1-q));ctx.lineTo(0,0);ctx.stroke();ctx.shadowColor='rgba(16,185,129,.35)';ctx.shadowBlur=12*(1-q)}
  let g=ctx.createLinearGradient(-sz/2,-sz/2,sz/2,sz/2);g.addColorStop(0,lerp(0,1,p)>.95?'#10b981':'#60e3b3');g.addColorStop(1,'#10b981');ctx.fillStyle=g;rr(-sz/2,-sz/2,sz,sz,sz*.22);ctx.fill();ctx.restore();
 }
 const wa=s(2.0,2.85,t),ww=portrait?W*.84:W*.49,wh=ww*(190/950),wx=portrait?(W-ww)/2:W*.295,wy=(portrait?H*.46:my-wh/2)+18*(1-wa);
 if(word.complete){ctx.save();ctx.globalAlpha=wa;ctx.beginPath();ctx.rect(wx-2,wy-2,ww*wa+4,wh+4);ctx.clip();ctx.drawImage(word,wx,wy,ww,wh);ctx.restore();}
 // Quiet left-to-right highlight, no repeated flashes and no fake financial data.
 if(t>1.8&&t<2.6){const a=Math.sin(Math.PI*(t-1.8)/.8)*.16;let x=lerp(mx-size*.6,mx+size*.6,s(1.8,2.6,t));ctx.fillStyle=`rgba(166,255,223,${a})`;ctx.fillRect(x,my-size*.4,Math.max(1,size*.009),size*.8)}
 let a=s(2.75,3.5,t);ctx.save();ctx.globalAlpha=a;ctx.textAlign='center';ctx.fillStyle='#e5f5ef';let fs=fitText(text[0],W*.86,Math.min(portrait?W*.041:H*.038,42));let ty=portrait?H*.57:H*.62;ctx.fillText(text[0],W/2,ty+12*(1-a));
 ctx.fillStyle='#95aaa9';fs=fitText(text[1],W*.84,Math.min(portrait?W*.024:H*.023,25));ctx.fillText(text[1],W/2,ty+short*.05+12*(1-a));ctx.restore();
 ctx.save();ctx.globalAlpha=s(3.0,3.55,t)*.65;ctx.textAlign='center';ctx.fillStyle='#8ab6aa';ctx.font='500 '+Math.max(12,short*.02)+'px Arial,sans-serif';ctx.fillText('plainledger.ca',W/2,portrait?H*.78:H*.88);ctx.restore();
}
function pause(){playing=false;cancelAnimationFrame(raf);document.getElementById('toggle').textContent='Play'}
function play(){pause();if(elapsed>=5)elapsed=0;playing=true;start=performance.now()-elapsed*1000;document.getElementById('toggle').textContent='Pause';raf=requestAnimationFrame(tick)}
function tick(ts){if(!playing)return;elapsed=(ts-start)/1000;if(elapsed>=5){elapsed=5;render(5);pause();dispatchEvent(new CustomEvent('splash:complete'));return}render(elapsed);raf=requestAnimationFrame(tick)}
window.PlainLedgerAnimation={render,resize,play,pause,seek(t){pause();elapsed=t;render(t)},duration:5};
window.__ready=word.decode().then(()=>{resize();if(!new URLSearchParams(location.search).has('capture')){if(reduced){elapsed=5;render(5)}else play()}});
document.getElementById('toggle').onclick=()=>playing?pause():play();document.getElementById('replay').onclick=()=>{elapsed=0;play()};document.getElementById('skip').onclick=()=>{elapsed=5;pause();render(5);dispatchEvent(new CustomEvent('splash:complete'))};addEventListener('resize',()=>resize());document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{if(e.matches){elapsed=5;pause();render(5)}});
})();
