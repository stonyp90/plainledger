    <!-- Initial background script - sets background based on saved theme preference before CSS loads -->
    <script>
      (function() {
        try {
          var storedTheme = localStorage.getItem('plainledger-theme') || 'dark';
          var isDark = storedTheme === 'dark' || 
            (storedTheme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.body.style.backgroundColor = isDark ? '#0f172a' : '#f8fafc';
          document.documentElement.style.backgroundColor = isDark ? '#0f172a' : '#f8fafc';
          if (isDark) document.documentElement.classList.add('dark');
        } catch (e) {
          // Fallback to dark mode if localStorage fails
          document.body.style.backgroundColor = '#0f172a';
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
