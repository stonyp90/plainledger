<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PlainLedger - Complete Infrastructure Architecture</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f8fafb 0%, #f0f4f3 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px;
        }
        
        .controls {
            background: white;
            padding: 16px 32px;
            border-radius: 12px;
            margin-bottom: 24px;
            display: flex;
            gap: 24px;
            align-items: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            border: 1px solid #e2e8f0;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #10b981, #059669);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 14px;
        }
        
        .logo-text {
            font-weight: 600;
            color: #1e293b;
            font-size: 16px;
        }
        
        .divider {
            width: 1px;
            height: 32px;
            background: #e2e8f0;
        }
        
        .controls button {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        
        .controls button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }
        
        .controls button.secondary {
            background: linear-gradient(135deg, #f59e0b, #d97706);
        }
        
        .controls button.secondary:hover {
            box-shadow: 0 4px 12px rgba(245, 158, 11, 0.3);
        }
        
        .controls span {
            color: #64748b;
            font-size: 13px;
        }
        
        .diagram-container {
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
            border: 1px solid #e2e8f0;
        }
        
        #diagram {
            display: block;
        }
        
        @media print {
            body {
                background: white;
                padding: 0;
            }
            .controls {
                display: none;
            }
            .diagram-container {
                box-shadow: none;
                border: none;
            }
        }
    </style>
</head>
<body>
    <div class="controls">
        <div class="logo">
            <div class="logo-icon">PL</div>
            <span class="logo-text">PlainLedger</span>
        </div>
        <div class="divider"></div>
        <span>Infrastructure Architecture</span>
        <div class="divider"></div>
        <button onclick="downloadSVG()">Download SVG</button>
        <button class="secondary" onclick="downloadPNG()">Download PNG</button>
        <button onclick="window.print()">Print</button>
    </div>
    
    <div class="diagram-container">
        <svg id="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1050" width="1600" height="1050">
            <defs>
                <!-- Color Palette: Light background with Gold & Green accents -->
                <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#f8fafb"/>
                    <stop offset="100%" style="stop-color:#f0f4f3"/>
                </linearGradient>
                
                <!-- Primary Green (Trust/Security) -->
                <linearGradient id="greenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#10b981"/>
                    <stop offset="100%" style="stop-color:#059669"/>
                </linearGradient>
                
                <!-- Gold (Premium/Value) -->
                <linearGradient id="goldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#f59e0b"/>
                    <stop offset="100%" style="stop-color:#d97706"/>
                </linearGradient>
                
                <!-- AWS Orange -->
                <linearGradient id="awsGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#FF9900"/>
                    <stop offset="100%" style="stop-color:#EC7211"/>
                </linearGradient>
                
                <!-- Azure Blue -->
                <linearGradient id="azureGradient" x1="0%" y1="0%" x2="0%" y2="100%">

                    <stop offset="100%" style="stop-color:#005A9E"/>

                <!-- Data Lake Layers -->

                    <stop offset="100%" style="stop-color:#78350f"/>
                </linearGradient>
                <linearGradient id="silverGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#6b7280"/>
                    <stop offset="100%" style="stop-color:#4b5563"/>
                </linearGradient>
                <linearGradient id="goldLayerGradient" x1="0%" y1="0%" x2="0%" y2="100%">
                    <stop offset="0%" style="stop-color:#f59e0b"/>
                    <stop offset="100%" style="stop-color:#d97706"/>
                </linearGradient>
                
                <!-- Subtle shadow -->
                <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
                    <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1e293b" flood-opacity="0.08"/>
                </filter>
                
                <!-- Arrow markers -->
                <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#94a3b8"/>
                </marker>
                <marker id="arrowGreen" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
                    <polygon points="0 0, 8 3, 0 6" fill="#10b981"/>
                </marker>
                <marker id="arrowGold" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

            </defs>
            
            <!-- Background -->
            <rect width="1600" height="1050" fill="url(#bgGradient)"/>
            
            <!-- Subtle grid pattern -->

            <!-- ==================== HEADER ==================== -->

            <!-- ==================== MAIN VALUE PROPOSITION ==================== -->

            <!-- ==================== LEFT COLUMN: USER FLOW ==================== -->

                <circle cx="70" cy="44" r="8" fill="#10b981"/>

                <!-- Arrow -->

            <!-- ==================== PRESENTATION LAYER ==================== -->

            <!-- ==================== APPLICATION LAYER ==================== -->

            <!-- ==================== AWS DATA LAKE ==================== -->

                <rect x="15" y="10" width="70" height="24" rx="6" fill="url(#awsGradient)"/>

    <script>
        function downloadSVG() {
            const svg = document.getElementById('diagram');
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svg);
            const blob = new Blob([svgString], { type: 'image/svg+xml' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = 'plainledger-infrastructure.svg';
            link.click();
            URL.revokeObjectURL(url);
        }
        
        function downloadPNG() {
            const svg = document.getElementById('diagram');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            
            // Set canvas size (2x for better quality)
            canvas.width = 3200;
            canvas.height = 2100;
            
            const serializer = new XMLSerializer();
            const svgString = serializer.serializeToString(svg);
            const img = new Image();
            
            img.onload = function() {
                ctx.fillStyle = '#f8fafb';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                
                const link = document.createElement('a');
                link.download = 'plainledger-infrastructure.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
            };
            
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgString)));
        }
    </script>
